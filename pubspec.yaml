name: cric_snap
description: "A new Flutter project"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  intl: ^0.19.0
  video_player: ^2.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  mockito: ^5.4.5
  build_runner: ^2.4.15
  sqflite_common_ffi: ^2.3.5
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0

flutter_native_splash:
  color: "#111827"
  image: assets/images/app_icon_splash.png
  android: true
  ios: true
  android_12:
    color: "#111827"
    image: assets/images/app_icon_splash.png
    icon_background_color: "#111827"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/images/app_icon_launcher.png"
  image_path_ios: "assets/images/app_icon_launcher.png"
  adaptive_icon_background: "#111827"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
